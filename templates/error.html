{% extends "base.html" %}
{% block title %}{{ code }} — Kindred{% endblock %}

{% block content %}
<div class="empty-state" style="min-height: 70vh; display:flex; flex-direction:column; align-items:center; justify-content:center;">
    <div class="empty-icon" style="font-family: var(--font-display); font-size: 80px; -webkit-text-fill-color: unset; color: var(--text-muted);">{{ code }}</div>
    <h2 style="font-family: var(--font-display); font-size: 28px; font-weight: 400; margin-bottom: 12px;">{{ message }}</h2>
    <p style="color: var(--text-secondary);">Something went off the path.</p>
    <a href="{{ url_for('auth.index') }}" class="btn-kindred-primary mt-3" style="width: auto; margin-top: 24px; padding: 12px 28px;">
        Go home →
    </a>
</div>
{% endblock %}
